<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="app.manifest" />


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


    <title>PoseCaster</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <style>
        .toast {
            background-color: #424242;
            bottom: 10px;
            right: 10px;
        }
    </style>
    <script type="text/javascript">
        $(document).ready(function () {
            $(document).on("keydown", function (e) {
                e = e || window.event;
                if (e.ctrlKey) {
                    var c = e.which || e.keyCode;
                    if (c == 82) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }
            });
        });
    </script>

</head>

<body style='overflow:hidden;height:100vh;width:100vw;background:black'>
    <iframe id='iframe' style='position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;'
        allow='autoplay; camera; microphone' onload="onModelLoad()"></iframe>

    <video height=0 width=0 style='display' id="video" autoplay muted playsinline></video>
</body>

<script>

    var MODELS = ['pose', 'hands', 'face', 'facemesh', 'holistic'];

    function hashParams() {
        return new URLSearchParams(window.location.hash.replace(/^#/, ''));
    }

    // Loads models/<model>/ from #model=...; the full hash is forwarded so the model page sees embed/out/target.
    function loadModelFromHash() {
        var model = hashParams().get('model');
        if (MODELS.indexOf(model) === -1) model = 'pose';
        document.getElementById('iframe').src = './models/' + model + '/index.html' + window.location.hash;
    }

    var embed = hashParams().get('embed') === 'true';
    loadModelFromHash();
    window.addEventListener('hashchange', loadModelFromHash);

    if (window.chrome && !embed) {
        M.toast({
            html: 'Welcome to PoseCaster! <br>Click anywhere on the video to enable background picture-in-picture feature.',
            displayLength: 10000,
            classes: 'toast'
        });
    }

    function iframeRef(frameRef) {
        return frameRef.contentWindow
            ? frameRef.contentWindow.document
            : frameRef.contentDocument
    }


    var inside, stream;

    function onModelLoad() {
        inside = iframeRef(document.getElementById("iframe"));

        stream = inside.getElementsByClassName("output_canvas")[0].captureStream(30);
        var video = document.getElementById("video");
        video.srcObject = stream;
        video.play();

    }

    function videoPicInPic() {
        var video = document.getElementById("video");
        if (video.requestPictureInPicture) {
            video.requestPictureInPicture();
        } else {
            // alert("Picture-in-Picture not supported");
        }
    }

    function endPictureInPicture() {
        if (document.pictureInPictureElement) {
            document.exitPictureInPicture()
            if (window.chrome) {
                M.toast({
                    html: 'Click again on the video to re-enable background picture-in-picture mode.',
                    displayLength: 5000,
                    classes: 'toast'
                });
            }
        } else {
            // alert("Picture-in-Picture not supported");
        }

    }

    var hidden, visibilityState, visibilityChange;

    if (typeof document.hidden !== "undefined") {
        hidden = "hidden", visibilityChange = "visibilitychange", visibilityState = "visibilityState";
    } else if (typeof document.msHidden !== "undefined") {
        hidden = "msHidden", visibilityChange = "msvisibilitychange", visibilityState = "msVisibilityState";
    }

    var document_hidden = document[hidden];

    document.addEventListener(visibilityChange, function () {
        document_hidden = document[hidden];

        if (document_hidden == true) {
            videoPicInPic();
        } else {
            endPictureInPicture();
        }

    });

</script>

</html>
